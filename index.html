!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark"><title>Masterpath</title>
<style>
:root{--bg:#030305;--c1:#0b0c11;--glass:rgba(18,20,28,.66);--bd:rgba(255,255,255,.07);--tx:#f5f6fa;--mut:#858a9b;--ac:#6f7ce0;--ac2:#3cbfa3;--gold:#d9ac5a;--ok:#2fb86f;--warn:#e08a3a;--pro:#9a6fe0;--sp:cubic-bezier(.32,1.3,.5,1);
--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);display:flex;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:radial-gradient(120% 60% at 80% -10%,rgba(111,124,224,.13),transparent 60%),radial-gradient(90% 50% at -10% 20%,rgba(60,191,163,.07),transparent 60%),var(--bg)}
@media(min-width:600px){body{align-items:center}#app{height:min(900px,96vh);border-radius:44px;border:1px solid var(--bd);box-shadow:0 30px 80px rgba(0,0,0,.5)}}
.scr{position:absolute;inset:0;overflow-y:auto;padding:22px 18px 110px;display:none}
.scr.on{display:block;animation:in .45s var(--sp)}
@keyframes in{from{opacity:0;transform:translateX(var(--dx,0px)) scale(.985)}to{opacity:1;transform:none}}
h1{font-size:34px;letter-spacing:-.8px;margin:6px 0 4px;line-height:1.08}
h2{font-size:21px;letter-spacing:-.4px;margin:22px 0 10px}
h3{font-size:16px;margin:0 0 3px}
p{margin:0;color:var(--mut);font-size:14px;line-height:1.45}
.card{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px}
.btn{border:0;border-radius:16px;padding<:14px 18px;font:600 16px var(--font);color:#fff;background:linear-gradient(135deg,var(--ac),#8a63d6);width:100%;cursor:pointer;transition:transform .25s var(--sp)}
.btn:active{transform:scale(.96)}.btn.g{background:var(--glass);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.45}
.search{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:22px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--bd);margin:14px 0 10px}
.search textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--tx);font:500 17px var(--font);height:74px}
.search textarea::placeholder{color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{padding:8px 13px;border-radius:99px;background:var(--glass);border:1px solid var(--bd);font-size:13px;color:var(--tx);cursor:pointer}
.bar{height:9px;border-radius:9px;background:rgba(127,127,160,.22);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .9s var(--sp)}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(111,124,224,.18);color:var(--ac)}
nav{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;padding:8px;border-radius:30px;background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--bd);z-index:20}
nav button{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--font);padding:6px 0;border-radius:22px;cursor:pointer;transition:all .3s var(--sp)}
nav button.on{color:var(--ac);background:rgba(111,124,224,.15)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;z-index:41;background:var(--c1);border-radius:30px 30px 0 0;border:1px solid var(--bd);padding:10px 20px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .55s var(--sp)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--mut);opacity:.4;margin:0 auto 14px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1.5px solid var(--bd);margin-bottom:8px;cursor:pointer;transition:all .25s var(--sp)}
.opt.sel{border-color:var(--ac);background:rgba(111,124,224,.14);transform:scale(1.015)}
.opt b{font-size:15px}.opt .e{font-size:22px}
input[type=range]{width:100%;accent-color:var(--ac);height:30px}
.lbl{font-size:13px;color:var(--mut);margin:14px 0 8px;font-weight:600}
.phase{margin-top:16px}
.task{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);background:none;display:grid;place-items:center;color:#fff;cursor:pointer;font-size:14px;transition:all .3s var(--sp);padding:0}
.done .ck{background:var(--ok);border-color:var(--ok);transform:scale(1.1)}
.done h3{text-decoration:line-through;opacity:.6}
.vid{display:flex;gap:10px;margin-top:10px;padding:10px;border-radius:14px;background:rgba(111,124,224,.1);border:1px solid var(--bd)}
.vid .pl{flex:none;width:76px;height:52px;border-radius:10px;background:linear-gradient(135deg,#2b2f55,#6f7ce0);display:grid;place-items:center;font-size:20px;text-decoration:none;color:#fff}
.vid ul{margin:4px 0 0;padding-left:16px;font-size:12.5px;color:var(--mut);line-height:1.5}
.fb{border-radius:16px;padding:12px 14px;margin-bottom:9px;display:flex;gap:10px;font-size:14px;line-height:1.4}
.fb.ok{background:rgba(47,184,111,.14)}.fb.fix{background:rgba(224,138,58,.14)}.fb.pro{background:rgba(176,124,255,.16)}
.fb em{font-style:normal;font-weight:700;display:block;margin-bottom:2px}
.badge{aspect-ratio:1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;gap:6px;border:1px solid var(--bd);background:var(--glass);cursor:pointer;transition:transform .3s var(--sp)}
.badge:active{transform:scale(.95)}
.badge.won{background:radial-gradient(circle at 50% 30%,rgba(217,172,90,.45),rgba(111,124,224,.18));box-shadow:0 0 34px rgba(217,172,90,.35);border-color:rgba(217,172,90,.6);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 52px rgba(217,172,90,.55)}}
.badge.lock{opacity:.4}.badge .ic{font-size:40px}.badge b{font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{position:relative}.x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--glass);color:var(--mut);font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0}
.stat{text-align:center}.stat b{font-size:28px;display:block;letter-spacing:-.5px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(127,127,160,.25);border-top-color:var(--ac);animation:sp 0.9s linear infinite;margin:26px auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
video{width:100%;border-radius:16px;max-height:220px;background:#000;margin-bottom:12px}
.toast{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;transition:transform .5s var(--sp)}
.toast.on{transform:translate(-50%,0)}
.back{background:none;border:0;color:var(--ac);font:600 16px var(--font);padding:0;cursor:pointer;margin-bottom:6px}
.dots{display:flex;gap:6px;margin:6px 0 14px}.dots i{flex:1;height:5px;border-radius:5px;background:rgba(127,127,160,.25);transition:background .4s}.dots i.on{background:var(--ac2)}
.cbub{display:flex;gap:10px;margin-bottom:14px}.cbub .av{flex:none;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:20px}.cbub .tx{background:var(--glass);border:1px solid var(--bd);border-radius:6px 18px 18px 18px;padding:12px 14px;font-size:15px;line-height:1.5}
.cbub ul{margin:8px 0 0;padding-left:18px;color:var(--mut);font-size:14px;line-height:1.55}
.go{flex:none;border:0;border-radius:99px;padding:7px 14px;background:rgba(111,124,224,.18);color:var(--ac);font:600 13px var(--font);margin-top:8px;cursor:pointer}
.scanbtn{flex:none;width:60px;height:60px;margin:-24px 4px 0;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 0 24px rgba(111,124,224,.5),0 0 56px rgba(60,191,163,.22);animation:glowp 2.6s ease-in-out infinite;cursor:pointer;padding:0;transition:transform .3s var(--sp)}
.scanbtn:active{transform:scale(.9)}nav .scanbtn svg{width:28px;height:28px;stroke:#fff;stroke-width:2}
@keyframes glowp{50%{box-shadow:0 0 34px rgba(111,124,224,.75),0 0 80px rgba(60,191,163,.35)}}
.vf{position:relative;border-radius:26px;min-height:190px;display:grid;place-items:center;text-align:center;padding:18px;border:1px solid var(--bd);background:linear-gradient(160deg,rgba(111,124,224,.16),rgba(60,191,163,.08));overflow:hidden}
.vf:before,.vf:after{content:"";position:absolute;width:34px;height:34px;border:3px solid var(--ac2);border-radius:10px}.vf:before{top:12px;left:12px;border-right:0;border-bottom:0}.vf:after{bottom:12px;right:12px;border-left:0;border-top:0}
.vf i{position:absolute;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--ac2),transparent);animation:sweep 2.8s ease-in-out infinite}
@keyframes sweep{0%,100%{top:16%}50%{top:84%}}
.vf img{max-width:100%;max-height:260px;border-radius:16px}
.ans{border-radius:24px;padding:18px;margin:14px 0 12px;background:linear-gradient(145deg,rgba(111,124,224,.17),rgba(60,191,163,.08));border:1px solid rgba(111,124,224,.5);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.live{background:#ff453a!important;color:#fff!important;animation:glowr 1s ease-in-out infinite}
@keyframes glowr{50%{box-shadow:0 0 0 8px rgba(255,69,58,.25)}}
.sinp{flex:1;min-width:0;background:none;border:1px solid var(--bd);border-radius:12px;padding:10px;color:var(--tx);font:15px var(--font);outline:0}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(111,124,224,.2);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:14px}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:24px;border:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);color:var(--tx);font:inherit;text-decoration:none;cursor:pointer;transition:transform .3s var(--sp)}
.act:active{transform:scale(.97)}
.act .ai{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:rgba(111,124,224,.2)}
.act .at{flex:1;display:flex;flex-direction:column;gap:2px}.act .at b{font-size:16px}.act .at small{color:var(--mut);font-size:13px}.act .ch{color:var(--mut);font-size:26px;line-height:1}
.act.dng{border-color:rgba(255,69,58,.4);background:rgba(255,69,58,.1)}.act.dng .ai{background:rgba(255,69,58,.2);color:#ff6b61}.act.off{opacity:.6;cursor:default}
.so{position:absolute;inset:0;z-index:70;overflow-y:auto;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(120% 60% at 80% -10%,rgba(111,124,224,.13),transparent 60%),var(--bg)}
html{color-scheme:dark}
.btn,.chip,.opt,.go,.act,.badge,.x,nav button,.card[onclick]{transition:transform .35s var(--sp),background .25s,box-shadow .25s,border-color .25s}
.btn:active,.chip:active,.opt:active,.go:active,.act:active,.badge:active,nav button:active,.card[onclick]:active{transform:scale(.94)}
.scr.on>*{animation:rise .62s var(--sp) both}
.scr.on>*:nth-child(2){animation-delay:.04s}.scr.on>*:nth-child(3){animation-delay:.08s}.scr.on>*:nth-child(4){animation-delay:.12s}.scr.on>*:nth-child(5){animation-delay:.16s}.scr.on>*:nth-child(6){animation-delay:.2s}.scr.on>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bar i{transform-origin:left;animation:grow 1s var(--sp) both}@keyframes grow{from{transform:scaleX(0)}}
nav button.on svg{animation:pop .5s var(--sp)}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.ck{transition:transform .4s var(--sp),background .25s}
.ph{position:absolute;left:0;right:0;top:2px;pointer-events:none;display:flex;gap:.32em;align-items:center;height:26px;overflow:hidden;font:500 17px var(--font);color:var(--mut);transition:opacity .2s}
.has .ph{opacity:0}
.phw{display:inline-block;color:var(--tx);font-weight:600;transition:transform .42s var(--sp),opacity .3s,filter .3s;white-space:nowrap}
.phw.out{transform:translateY(-130%);opacity:0;filter:blur(6px)}.phw.pre{transform:translateY(130%);opacity:0;filter:blur(6px);transition:none}
.cf{position:absolute;left:50%;top:45%;z-index:80;pointer-events:none}
.cf i{position:absolute;width:8px;height:12px;border-radius:2px;animation:fly 1.1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* ---------- scan page v2 ---------- */
.eyebrow{font:600 11px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.segc{display:flex;gap:4px;padding:4px;margin:14px 0 16px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--bd);width:fit-content;max-width:100%}
.segc button{display:flex;align-items:center;gap:0;padding:9px 11px;border:0;border-radius:12px;background:none;color:var(--mut);font:600 13px var(--font);cursor:pointer;transition:all .4s var(--sp)}
.segc button span{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .45s var(--sp),opacity .25s,margin .3s}
.segc button.on{background:rgba(255,255,255,.1);color:var(--tx);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.segc button.on span{max-width:130px;opacity:1;margin-left:7px}
.vf2{position:relative;height:min(44vh,370px);border-radius:28px;overflow:hidden;cursor:pointer;background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.05),transparent 60%),#07080b;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 0 80px rgba(0,0,0,.7),0 24px 50px -24px rgba(0,0,0,.9)}
.vf2 .grid{position:absolute;inset:0;width:100%;height:100%;stroke:rgba(255,255,255,.06);stroke-width:.4;fill:none}
.vf2 .c{position:absolute;width:26px;height:26px;border:2px solid rgba(255,255,255,.55);animation:breathe 3s ease-in-out infinite}
.c.tl{top:18px;left:18px;border-right:0;border-bottom:0;border-top-left-radius:9px}.c.tr{top:18px;right:18px;border-left:0;border-bottom:0;border-top-right-radius:9px}.c.bl{bottom:18px;left:18px;border-right:0;border-top:0;border-bottom-left-radius:9px}.c.br{bottom:18px;right:18px;border-left:0;border-top:0;border-bottom-right-radius:9px}
@keyframes breathe{50%{transform:scale(.92);opacity:.6}}
.vf2 .sweep{position:absolute;left:8%;right:8%;top:16%;height:1px;background:linear-gradient(90deg,transparent,rgba(111,124,224,.9),transparent);box-shadow:0 0 14px rgba(111,124,224,.7);animation:sweep 3.4s ease-in-out infinite}
.vf2.busy .sweep{animation-duration:1.1s}
.vf-mid{position:absolute;inset:0;display:grid;place-items:center;padding:36px}
.vf-mid img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.vf-hint{text-align:center}.vf-hint b{display:block;font-size:21px;letter-spacing:-.3px}.vf-hint span{display:block;margin-top:9px;font-size:12px;letter-spacing:.05em;color:var(--mut);line-height:1.7}
.dock{display:flex;align-items:center;justify-content:space-between;padding:22px 10px 4px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:7px;width:64px;background:none;border:0;color:var(--tx);font:500 11px var(--font);cursor:pointer}
.dbtn .ic{width:46px;height:46px;padding:12px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--bd)}
.dbtn.live{background:none!important;animation:none}.dbtn.live .ic{background:#ff453a;border-color:#ff453a;color:#fff;animation:glowr 1s ease-in-out infinite}
.shutter{width:78px;height:78px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:none;padding:5px;cursor:pointer;transition:transform .3s var(--sp)}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#f4f5f8;transition:transform .25s var(--sp)}
.shutter:active{transform:scale(.92)}.shutter:active i{transform:scale(.85)}
.qrow{position:relative;margin-top:14px}.qrow .sinp{width:100%;padding:14px 52px 14px 18px;border-radius:99px;font-size:15px;background:rgba(255,255,255,.04)}
.qgo{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:var(--tx);color:#000;display:grid;place-items:center;cursor:pointer;padding:0}
.ans2{margin:14px 0 6px;padding:20px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.09);box-shadow:0 20px 40px -24px rgba(0,0,0,.9)}
.ans2 h2{margin:8px 0 10px;font-size:24px;letter-spacing:-.5px}.ans-t{font-size:16px;line-height:1.55;white-space:pre-wrap;color:#e9eaf0}
.res-top{display:flex;align-items:center;justify-content:space-between}.thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid var(--bd)}
.st{position:relative;display:flex;gap:14px;padding-bottom:18px}.st:not(:last-child):before{content:"";position:absolute;left:13px;top:32px;bottom:2px;width:1px;background:linear-gradient(var(--bd),transparent)}
.st .dot{flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--font);background:rgba(255,255,255,.07);border:1px solid var(--bd)}
.st h3{font-size:15px}.st p{margin-top:3px;color:#c9ccd6}
.ask{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 18px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--bd);margin-top:6px}
.ask input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:15px var(--font)}
.ask .ib{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--tx);display:grid;place-items:center;cursor:pointer;padding:0}
.ask .ib.send{background:var(--tx);color:#000}
.listen{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:99px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--tx);font:600 14px var(--font);cursor:pointer;margin:10px 8px 0 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head>
<body>
<div id="app">
 <section class="scr on" id="home"></section>
 <section class="scr" id="path"></section>
 <section class="scr" id="library"></section>
 <section class="scr" id="coach"></section>
 <section class="scr" id="profile"></section>
 <section class="scr" id="scan"></section>
 <nav id="nav"></nav>
 <div class="sheet-bg" id="bg"></div>
 <div class="sheet" id="sheet"></div>
 <div class="toast" id="toast"></div>
 <div class="so" id="so"></div>
 <div class="so" id="pw"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',library:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><path d="M17 6l4 1-3 13-4-1"/>',coach:'<rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'};
const TABS=[["home","Home"],["library","Library"],["coach","Coach"],["profile","Profile"]];
const STYLES={Visual:["🎨","Diagrams, formulas and visual breakdowns"],Auditory:["🎧","Audio notes and talk-throughs"],"Reading/Writing":["📖","Deep written breakdowns"],"Hands On":["🤸","Hands-on action drills"]};
const BASE=["Total beginner","Intermediate","Pro"];
const LEVELS=["Casual Explorer","Steady Learner","Committed","Intensive Bootcamp"];
let S={paths:[],fb:[],tab:"home",cur:null,streak:0,last:null};
try{const x=localStorage.getItem(DK());if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
S.paths.forEach(p=>{if(p.style==="Kinesthetic")p.style="Hands On"});if(S.style==="Kinesthetic")S.style="Hands On";
const DK=()=>{try{const c=localStorage.getItem("mp_cur");return c?"mp_d_"+c:"mp1"}catch(e){return"mp1"}};
const freshS=()=>({paths:[],fb:[],tab:"home",cur:null,streak:0,last:null});
const save=()=>{try{localStorage.setItem(DK(),JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- navigation ---------- */
const ORD=['home','path','library','scan','coach','profile'];
function go(t){const dx=ORD.indexOf(t)>=ORD.indexOf(S.tab)?'26px':'-26px';S.tab=t;document.querySelectorAll(".scr").forEach(e=>e.classList.remove("on"));const el=$("#"+t);el.style.setProperty('--dx',dx);el.classList.add("on");render()}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)}
function openSheet(h){$("#sheet").innerHTML='<div class="grab"></div>'+h;$("#sheet").classList.add("on");$("#bg").classList.add("on")}
function closeSheet(){LOCKSHEET=false;try{SPK++;speechSynthesis.cancel()}catch(e){}$("#sheet").classList.remove("on");$("#bg").classList.remove("on")}
let LOCKSHEET=false;
$("#bg").onclick=()=>{if(!LOCKSHEET)closeSheet()};

/* ---------- curriculum engine (local; swap generate() for a real LLM call) ---------- */
function pct(p){const t=p.phases.flatMap(x=>x.tasks);return Math.round(t.filter(x=>x.done).length/t.length*100)}
function generateTpl(topic,style,lvl,base){
 const n=[2,3,4,5][lvl], T=topic, b=BASE[base].toLowerCase();
 const verb={Visual:"Watch and map",Auditory:"Listen and narrate",["Reading/Writing"]:"Read and write up","Hands On":"Practice"}[style];
 const P=[
  ["Phase 1: Foundations",["Map the big picture of "+T,"Learn the 5 core terms of "+T,"First guided attempt at "+T,"Spot the most common beginner mistakes","Set up your practice space for "+T]],
  ["Phase 2: Build skill",["Drill one core technique in "+T,"Combine two techniques in "+T,"Slow-motion practice with self-review","Solve a real problem using "+T,"Compare your work to an expert’s"]],
  ["Phase 3: Mastery",["Run a full "+T+" session end-to-end","Teach "+T+" to a friend in 2 minutes","Fix your weakest area in "+T,"Create a signature project in "+T,"Final showcase of your "+T+" skills"]]];
 if(base===2)P[0][1][0]="Benchmark your current "+T+" level";
 if(base===1)P[0][1].splice(0,2,"Fast skills check in "+T,"Fill your biggest gap in "+T);
 return{id:Date.now(),topic:cap(T),style,lvl,base:b,created:Date.now(),
  phases:P.map(([title,ts])=>({title,tasks:ts.slice(0,n).map((t,i)=>({t,d:verb+" · about "+[5,10,20,40][lvl]+" min",done:false,
   v:style==="Visual"?{q:T+" "+t.replace(/^Phase.*/,"")+" tutorial short",w:["How the movement or process flows from start to finish","One detail beginners usually miss","What a ‘good’ result looks like"]}:null}))}))};
}

/* ---------- AI coach (simulated feedback; replace with a vision-model call) ---------- */
const GOOD=["Your setup is clear and steady, which makes the skill easy to read","Your pace looks calm and controlled","You stayed committed from start to finish","Your posture and focus look confident","You showed up and practiced, and that is the hardest part"];
const FIX=["Slow down the first second so your starting position is set before you move","Keep your eyes on the key point of the action instead of looking away","Make the movement or step smaller and cleaner, then speed up later","Reset between reps so each attempt starts from the same place"];
const PRO=["Record from the side next week and compare it with today’s clip","Use a 3-count rhythm: prepare, do, finish","Say the one cue out loud while you practice, such as ‘smooth, not fast’","Finish every rep with a deliberate pause to lock the feel in"];
function feedback(topic,seed){const r=(a,o)=>a[(seed+o)%a.length];return{topic,ok:[r(GOOD,0),r(GOOD,2)],fix:r(FIX,1),pro:r(PRO,3),t:Date.now()}}

function analyze(topic,file,after){
 openSheet('<h2 style="margin-top:6px">Analyzing your clip</h2><div class="spin"></div><p style="text-align:center">Your coach is watching…</p>');
 setTimeout(()=>{const f=feedback(topic,(file?file.size:Math.random()*99)|0);S.fb.unshift(f);save();
  const now=new Date().toDateString();if(S.last!==now){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=now;save()}
  openSheet('<h2 style="margin-top:6px">Great practice 🎉</h2><p style="margin-bottom:12px">Day logged for <b>'+esc(topic)+'</b>. Here is your coaching.</p>'+fbHtml(f)+'<button class="btn" onclick="closeSheet();render()">Keep going</button>');
  if(after)after()},1800)}
function fbHtml(f){return f.ok.map(x=>'<div class="fb ok"><span>✅</span><div><em>What you’re doing right</em>'+x+'</div></div>').join('')+
 '<div class="fb fix"><span>🎯</span><div><em>One precise fix</em>'+f.fix+'</div></div><div class="fb pro"><span>✨</span><div><em>Pro trick</em>'+f.pro+'</div></div>'}
function pick(topic,after){
 const i=document.createElement("input");i.type="file";i.accept="video/*";i.setAttribute("capture","user");
 i.onchange=()=>{const f=i.files[0];if(!f)return;
  let pv="";try{pv=URL.createObjectURL(f)}catch(e){}
  analyze(topic,f,after)};
 i.click()}
function checkin(pid){const p=S.paths.find(x=>x.id==pid);
 openSheet('<h2 style="margin-top:6px">Daily video check-in</h2><p style="margin-bottom:14px">Record or upload a 5-second clip of yourself practicing. Everyone checks in, whatever their learning style.</p><button class="btn" onclick="pick(\''+esc(p.topic).replace(/'/g,"\\'")+'\')">🎥 Record or upload clip</button><div style="height:10px"></div><button class="btn g" onclick="closeSheet()">Maybe later</button>')}

/* ---------- intake ---------- */
let IN={};
function intake(topic){IN={topic,style:"Visual",lvl:1,base:0,step:0};step();fitLoad(IN)}
async function fitLoad(me){
 try{const sm=await getSample();if(!sm)throw 0;
  const r=await sm.json(`A learner wants to learn: ${me.topic}\nRate how well each learning style fits THIS topic. Visual = diagrams, formulas, pictures. Auditory = spoken explanations. Reading/Writing = written instructions and breakdowns. Hands On = hands-on drills and physically practicing on camera.\nlevels: for each style one of best, ok or weak (best for at most 2 styles; weak only when the style would honestly be less efficient or confusing for this topic, for example breaking a habit like nail biting is mostly learned through instructions, so Hands On and Visual are weak).\nnotes: for each style rated weak, one friendly sentence (max 30 words, addressed to the learner) saying why it could be less efficient or confusing for this topic and which styles usually work better. Leave out styles that are not weak.\nReply ONLY JSON, using double-quoted keys: {levels:{Visual:string,Auditory:string,"Reading/Writing":string,"Hands On":string},notes:{}}`);
  me.fit=r&&r.levels?r:null}catch(e){me.fit=null}
 if(IN===me&&me.step===0)step()}
function step(){
 const s=IN.step;let h='<p style="color:var(--ac);font-weight:600">Question '+(s+1)+' of 3</p><h2 style="margin-top:4px">'+esc(cap(IN.topic))+'</h2>';
 if(s===0){const F=IN.fit,lv=k=>F&&F.levels&&F.levels[k],nt=F&&F.notes&&F.notes[IN.style];
  h+='<div class="lbl">How do you learn best?</div><div class="fb pro" style="margin-bottom:10px"><span>🧭</span><div><em>Quick heads up</em>Some topics are easier to learn with certain styles. If another style would fit your topic better, we’ll tell you. You can always choose whichever you like.</div></div>'+
  (F===undefined?'<p style="margin-bottom:8px">Checking which styles suit this topic…</p>':'')+
  Object.entries(STYLES).map(([k,v])=>{const l=lv(k);return '<div class="opt '+(IN.style===k?"sel":"")+'" onclick="IN.style=\''+k+'\';step()"><span class="e">'+v[0]+'</span><div style="flex:1"><b>'+k+'</b><p>'+v[1]+'</p></div>'+(l==='best'?'<span class="tag" style="background:rgba(47,184,111,.18);color:var(--ok)">Great fit</span>':l==='weak'?'<span class="tag" style="background:rgba(224,138,58,.18);color:var(--warn)">Less ideal</span>':'')+'</div>'}).join('')+
  (nt&&lv(IN.style)==='weak'?'<div class="fb fix"><span>💡</span><div><em>Heads up on '+esc(IN.style)+'</em>'+esc(nt)+' You can still go with it if you prefer.</div></div>':'')}
 if(s===1){h+='<div class="lbl">Timeframe and intensity</div><div class="card"><h3 id="lv">'+LEVELS[IN.lvl]+'</h3><p id="lvd">'+["Light daily micro-tasks","A comfortable daily rhythm","More tasks, faster progress","High-volume accelerated days"][IN.lvl]+'</p><input type="range" min="0" max="3" value="'+IN.lvl+'" oninput="IN.lvl=+this.value;$(\'#lv\').textContent=LEVELS[IN.lvl];$(\'#lvd\').textContent=[\'Light daily micro-tasks\',\'A comfortable daily rhythm\',\'More tasks, faster progress\',\'High-volume accelerated days\'][IN.lvl]"></div>'}
 if(s===2){h+='<div class="lbl">Where are you starting from?</div>'+BASE.map((b,i)=>'<div class="opt '+(IN.base===i?"sel":"")+'" onclick="IN.base='+i+';step()"><span class="e">'+["🌱","📈","🏆"][i]+'</span><b>'+b+'</b></div>').join('')}
 h+='<div style="height:8px"></div><button class="btn" onclick="next()">'+(s===2?"Build my path ✨":"Continue")+'</button>';
 openSheet(h)}
function next(){if(IN.step<2){IN.step++;step();return}
 openSheet('<h2 style="margin-top:6px">Designing your roadmap</h2><div class="spin"></div><p style="text-align:center">Tailoring phases to your pace…</p>');
 setTimeout(async()=>{const p=await generate(IN.topic,IN.style,IN.lvl,IN.base);S.paths.unshift(p);S.cur=p.id;save();closeSheet();$("#search")&&($("#search").value="");openPath(p.id)},1500)}

/* ---------- screens ---------- */
function openPath(id){S.cur=id;go("path")}
function toggle(pid,pi,ti){const p=S.paths.find(x=>x.id==pid),t=p.phases[pi].tasks[ti];t.done=!t.done;save();
 const was=p.done;render();
 if(t.done){if(pct(p)===100&&!p.done){p.done=Date.now();save();toast("🏆 Path mastered! Badge unlocked");setTimeout(()=>go("library"),1200)}else setTimeout(()=>checkin(pid),350)}}
async function getSample(){try{return window.claude?await claude.use('sample'):null}catch(e){return null}}
const STY_HINT={Visual:'diagrams, formulas and visual representations',Auditory:'talking it through out loud or listening',
 'Reading/Writing':'reading a short guide and writing it up in their own words',"Hands On":'hands-on action drills'};
async function coach(pid,pi,ti){
 const p=S.paths.find(x=>x.id==pid),t=p.phases[pi].tasks[ti];
 if(p.style==='Reading/Writing')return rwCoach(pid,pi,ti);
 if(p.style==='Hands On')return kinCoach(pid,pi,ti);
 if(p.style==='Auditory')return audCoach(pid,pi,ti);
 if(p.style==='Visual')return visCoach(pid,pi,ti);
 if(t.plan&&t.plan.length){lesson(pid,pi,ti,0);return}
 openSheet('<h2 style="margin-top:6px">Your AI coach is preparing</h2><div class="spin"></div><p style="text-align:center">Building a lesson for '+esc(t.t)+'…</p>');
 const sm=await getSample();
 if(sm){try{
  const mins=[5,10,20,40][p.lvl];
  const r=await sm.json(`You are Masterpath, a warm, encouraging expert coach. Coach ONE learner through ONE task today.\nTopic: ${p.topic}\nToday's task: ${t.t}\nLearning style: ${p.style} (${STY_HINT[p.style]})\nStarting point: ${p.base}\nIntensity: ${LEVELS[p.lvl]}, about ${mins} minutes\n\nWrite 4 or 5 coaching steps in order: get ready; one step tailored to their learning style; the real hands-on practice with concrete instructions (what to do, how many reps or minutes, what good looks like); a quick self-review. Be specific to this topic and task, never generic. Second person, friendly, each body at most 3 short sentences. Reply with ONLY JSON: {"steps":[{"h":"short title","b":"text"}]}`);
  const a=Array.isArray(r)?r:(r&&r.steps);
  if(Array.isArray(a)&&a.length>=3){t.plan=a.slice(0,6).map(s=>({h:String(s.h||'Step'),b:String(s.b||''),ul:Array.isArray(s.ul)&&s.ul.length?s.ul.map(String):undefined,link:String(s.q||(t.t+' '+p.topic))}));save()}
 }catch(e){toast(e&&e.code==='not_granted'?'AI access declined – using built-in lesson':'Coach is busy – using built-in lesson')}}
 else toast('AI coach unavailable here – using built-in lesson');
 lesson(pid,pi,ti,0)}
function askBox(pid,pi,ti){return '<div class="card" style="margin:6px 0 12px"><b style="font-size:14px">Ask your coach</b><div class="row" style="margin-top:8px"><input id="q" placeholder="Stuck? Ask anything…" style="flex:1;min-width:0;background:none;border:1px solid var(--bd);border-radius:12px;padding:10px;color:var(--tx);font:15px var(--font);outline:0"><button class="go" id="mic1" style="margin:0" aria-label="Tap to speak" onclick="micAsk('+pid+','+pi+','+ti+')">🎤</button><button class="go" style="margin:0" onclick="ask('+pid+','+pi+','+ti+')">Ask</button></div><p id="ans" style="margin-top:8px;color:var(--tx);white-space:pre-wrap"></p></div>'}
async function ask(pid,pi,ti){
 const q=$('#q').value.trim(),a=$('#ans');if(!q)return;
 const p=S.paths.find(x=>x.id==pid),t=p.phases[pi].tasks[ti];a.textContent='Thinking…';
 const sm=await getSample();if(!sm){a.textContent='The AI coach needs AI access, which is not available here.';return}
 try{await sm(`You are Masterpath, a warm, encouraging expert coach. The learner is working on this task.\nTopic: ${p.topic}\nTask: ${t.t}\nLearning style: ${p.style}\nStarting point: ${p.base}\nThe learner asks: ${q}\nAnswer in under 90 words, plain text, concrete and encouraging.`,{cache:false,onText:({text})=>{a.textContent=text}})}
 catch(e){a.textContent='Could not reach the coach. Try again in a moment.'}}
async function generate(topic,style,lvl,base){
 const sm=await getSample(),n=[2,3,4,5][lvl],mins=[5,10,20,40][lvl];
 if(sm){try{
  const r=await sm.json(`You are Masterpath, an expert coach who designs learning paths. Create a custom path for this learner.\nTopic: ${topic}\nLearning style: ${style}\nStarting point: ${BASE[base]}\nIntensity: ${LEVELS[lvl]} (about ${mins} minutes per task)\n\nRules:\n- Exactly 3 phases. Each phase title must be specific to this topic and show how the learner progresses from their starting point. Never use generic titles like Foundations, Build skill or Mastery.\n- Each phase has exactly ${n} tasks, in teaching order, each building on the last.\n- Field t is the task title. It must name exactly what the learner will learn or be able to do in that task, in under 9 words. A good example for boxing: The jab: stance, hip turn and snap back. Never use vague titles like Practice basics, Learn the key terms or Final showcase.\n- Field d is one short sentence on the concrete skill or knowledge gained.\n- The path must clearly differ from a path for any other topic and suit the starting point.\nReply with ONLY JSON shaped like this, using double-quoted keys: {phases:[{title:string,tasks:[{t:string,d:string}]}]}`);
  if(r&&Array.isArray(r.phases)&&r.phases.length>=3&&r.phases.every(x=>x&&Array.isArray(x.tasks)&&x.tasks.length)){
   return{id:Date.now(),topic:cap(topic),style,lvl,base:BASE[base].toLowerCase(),created:Date.now(),
    phases:r.phases.slice(0,3).map(x=>({title:String(x.title||'Phase'),tasks:x.tasks.slice(0,n).map(k=>({t:String(k.t||'Task'),d:String(k.d||'')+' · about '+mins+' min',done:false,v:null}))}))}}
 }catch(e){}}
 toast('AI unavailable – built a standard path instead');
 return generateTpl(topic,style,lvl,base)}
async function rwCoach(pid,pi,ti){
 const p=S.paths.find(x=>x.id==pid),t=p.phases[pi].tasks[ti];
 if(t.rw&&t.rw.sections){rwStep(pid,pi,ti,0);return}
 openSheet('<h2 style="margin-top:6px">Your coach is writing today’s reading</h2><div class="spin"></div><p style="text-align:center">Tailored to '+esc(t.t)+'…</p>');
 const sm=await getSample();
 if(sm){try{
  const w=[70,100,130,160][p.lvl];
  const r=await sm.json(`You are Masterpath, an expert teacher writing a short reading for ONE learner who learns best by reading and writing.\nPath: ${p.topic}\nToday's task: ${t.t}\nWhat they will gain: ${t.d}\nStarting point: ${p.base}\nIntensity: ${LEVELS[p.lvl]}\n\nWrite 3 reading sections of about ${w} words each. Teach the actual content of this specific task: real explanations, a concrete example, and the why behind it, in plain language suited to their starting point. No filler, no generic advice. Each section has h (clear heading), text (the reading itself) and key (one-sentence key idea). Then write prompt: one instruction asking the learner to explain in their own words what they understood and give an example of their own.\nReply with ONLY JSON, using double-quoted keys: {sections:[{h:string,text:string,key:string}],prompt:string}`);
  if(r&&Array.isArray(r.sections)&&r.sections.length>=2&&r.prompt){
   t.rw={sections:r.sections.slice(0,4).map(s=>({h:String(s.h||''),text:String(s.text||''),key:String(s.key||'')})),prompt:String(r.prompt)};save();rwStep(pid,pi,ti,0);return}
 }catch(e){toast(e&&e.code==='not_granted'?'AI access declined – using built-in lesson':'Coach is busy – using built-in lesson')}}
 else toast('AI coach unavailable here – using built-in lesson');
 lesson(pid,pi,ti,0)}
function wcount(el){const v=el.value.trim();$('#wc').textContent=(v?v.split(/\s+/).length:0)+' words · aim for 40 or more'}
function rwStep(pid,pi,ti,i){
 const p=S.paths.find(x=>x.id==pid),t=p.phases[pi].tasks[ti],rw=t.rw,n=rw.sections.length;
 const dots='<div class="dots">'+Array.from({length:n+1},(_,k)=>'<i class="'+(k<=i?'on':'')+'"></i>').join('')+'</div>';
 const head='<p style="color:var(--ac);font-weight:600">Reading and writing · '+(i<n?'Reading '+(i+1)+' of '+n:'Your turn to write')+'</p><h2 style="margin-top:4px">'+esc(t.t)+'</h2>'+dots;
 const back=i?'<div style="height:8px"></div><button class="btn g" onclick="rwStep('+pid+','+pi+','+ti+','+(i-1)+')">'+(i===n?'Re-read':'Back')+'</button>':'';
 if(i<n){const s=rw.sections[i];
  openSheet(head+'<div class="card"><h3 style="font-size:18px;margin-bottom:8px">'+esc(s.h)+'</h3>'+s.text.split(/\n+/).map(x=>'<p style="color:var(--tx);font-size:16px;line-height:1.6;margin-bottom:10px">'+esc(x)+'</p>').join('')+'</div><div class="fb pro"><span>💡</span><div><em>Key idea</em>'+esc(s.key)+'</div></div>'+askBox(pid,pi,ti)+'<button class="btn" onclick="rwStep('+pid+','+pi+','+ti+','+(i+1)+')">'+(i===n-1?'Now write what you understood':'Next section')+'</button>'+back);return}
 openSheet(head+'<div class="cbub"><div class="av">🧭</div><div class="tx"><b>Write it in your own words</b><br>'+esc(rw.prompt)+'</div></div><textarea id="wr" oninput="wcount(this)" placeholder="Write what you understood…" style="width:100%;height:150px;resize:none;background:var(--glass);border:1px solid var(--bd);border-radius:16px;padding:12px;color:var(--tx);font:16px/1.5 var(--font);outline:0">'+esc(t.note||'')+'</textarea><p id="wc" style="margin:6px 0 12px">0 words · aim for 40 or more</p><div id="rwres"></div><button class="btn" id="sub" onclick="rwSubmit('+pid+','+pi+','+ti+')">Get coach feedback</button>'+back);
 wcount($('#wr'))}
async function rwSubmit(pid,pi,ti){
 const p=S.paths.find(x=>x.id==pid),t=p.phases[pi].tasks[ti],txt=$('#wr').value.trim(),words=txt?txt.split(/\s+/).length:0,out=$('#rwres'),btn=$('#sub');
 if(words<15){toast('Write a few more sentences first');return}
 t.note=txt;save();btn.disabled=true;btn.textContent='Your coach is reading…';
 const sm=await getSample();let f=null;
 if(sm){try{f=await sm.json(`You are Masterpath, a warm, honest expert teacher. A learner studied a reading and then wrote what they understood.\nPath: ${p.topic}\nTask: ${t.t}\nReading they studied:\n${t.rw.sections.map(s=>s.h+': '+s.text).join('\n')}\n\nWriting prompt: ${t.rw.prompt}\n\nBEGIN LEARNER WRITING\n${txt}\nEND LEARNER WRITING\n\nJudge how well they understood the reading. Be specific, kind and accurate. Reply with ONLY JSON, using double-quoted keys: {ok:[1 or 2 specific things they understood correctly],gap:the single most important thing missing or slightly wrong, said kindly with the correct idea,tip:one concrete tip to deepen or apply this}`,{cache:false})}catch(e){}}
 if(f&&f.ok){const ok=[].concat(f.ok);
  out.innerHTML=ok.map(x=>'<div class="fb ok"><span>✅</span><div><em>What you understood</em>'+esc(x)+'</div></div>').join('')+(f.gap?'<div class="fb fix"><span>🎯</span><div><em>Fill the gap</em>'+esc(f.gap)+'</div></div>':'')+(f.tip?'<div class="fb pro"><span>✨</span><div><em>Level up</em>'+esc(f.tip)+'</div></div>':'')}
 else out.innerHTML='<p style="margin-bottom:12px">Feedback is not available right now, but your writing is saved. Nice work.</p>';
 btn.disabled=false;btn.textContent='Done · Mark complete';btn.onclick=()=>finish(pid,pi,ti)}
async function kinCoach(pid,pi,ti){
 const p=S.paths.find(x=>x.id==pid),t=p.phases[pi].tasks[ti];
 if(t.kin){kinStep(pid,pi,ti,0);return}
 openSheet('<h2 style="margin-top:6px">Your coach is preparing your task</h2><div class="spin"></div><p style="text-align:center">'+esc(t.t)+'…</p>');
 const sm=await getSample();

 // Stripe Checkout Handler for 2-Week Trial / Continued Access
async function handleStripeCheckout() {
  try {
    const { data: { user } } = await supabase.auth.getUser();
    const userId = user ? user.id : 'anonymous';

    const response = await fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId })
    });

    const data = await response.json();
    
    if (data.url) {
      window.location.href = data.url;
    } else {
      alert('Could not initiate checkout. Please try again.');
    }
  } catch (error) {
    console.error('Checkout error:', error);
  }
}
